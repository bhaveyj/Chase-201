services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chase201
      POSTGRES_USER: chase201
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chase201 -d chase201"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
