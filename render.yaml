services:
  - type: web
    name: chase201-api
    runtime: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CATALOG_VERSION
        value: real-players-v2
      - key: FRONTEND_URL
        value: https://web-omega-eight-96.vercel.app
      - key: API_URL
        value: https://chase201-api.onrender.com
      - key: CORS_ORIGINS
        value: '["https://web-omega-eight-96.vercel.app"]'
