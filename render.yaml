services:
  - type: web
    name: chase201-api
    runtime: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chase201-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CATALOG_VERSION
        value: real-players-v2
      - key: FRONTEND_URL
        value: https://chase201-web.onrender.com
      - key: API_URL
        value: https://chase201-api.onrender.com
      - key: CORS_ORIGINS
        value: '["https://chase201-web.onrender.com"]'

  - type: web
    name: chase201-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace apps/web
    startCommand: npm run start --workspace apps/web -- --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.19.2
      - key: NEXT_PUBLIC_API_URL
        value: https://chase201-api.onrender.com

databases:
  - name: chase201-db
    plan: free
    databaseName: chase201
    user: chase201
    postgresMajorVersion: "17"
