[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chase201-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.12,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "authlib>=1.8,<2", "httpx>=0.28,<1",
  "httpx2>=2.13,<3", "itsdangerous>=2.2,<3", "joserfc>=1.7,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "hypothesis>=6.120,<7", "ruff>=0.9,<1", "mypy>=1.14,<2", "import-linter>=2.1,<3", "aiosqlite>=0.20,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chase201 = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires PostgreSQL for row-lock concurrency checks"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["chase201", "chase_engine"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Simulation has no application or framework dependencies"
type = "forbidden"
source_modules = ["chase_engine"]
forbidden_modules = ["chase201", "fastapi", "sqlalchemy", "pydantic"]
