name: Verify Chase 201
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chase201
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: chase201_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chase201 -d chase201_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://chase201:test-only@localhost:5432/chase201_test
      TEST_DATABASE_URL: postgresql+asyncpg://chase201:test-only@localhost:5432/chase201_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r apps/api/requirements.lock
          .venv/bin/pip install --no-deps -e apps/api
          npm ci
      - name: Backend lint, type and architecture checks
        working-directory: apps/api
        run: |
          ../../.venv/bin/ruff check src tests scripts migrations
          ../../.venv/bin/mypy src
          ../../.venv/bin/lint-imports
      - name: Migrations and schema drift
        working-directory: apps/api
        run: |
          ../../.venv/bin/alembic upgrade head
          ../../.venv/bin/alembic check
          ../../.venv/bin/alembic downgrade base
          ../../.venv/bin/alembic upgrade head
      - name: Backend tests including PostgreSQL concurrency
        working-directory: apps/api
        run: ../../.venv/bin/pytest -q
      - name: Generated API contract stays in sync
        run: |
          cd apps/api
          ../../.venv/bin/python scripts/export_openapi.py
          cd ../..
          npm run api:types
          git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api.generated.ts
      - name: Common-seed gameplay balance gate
        run: .venv/bin/python apps/api/scripts/calibrate.py --seeds 300 --check --catalog --output balance-report.json
      - name: Rating caps and All Out scoring balance
        run: .venv/bin/python apps/api/scripts/draft_balance.py --seeds 300 --check --output draft-balance-report.json
      - name: Frontend validation
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Browser journeys and accessibility
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: apps/web/test-results
          if-no-files-found: ignore
